
name: AWS Cloud Deployment

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate cloud deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment script
        run: |
          bash -n deploy/deploy.sh

      - name: Validate cloud Docker Compose
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.cloud.yml \
            config --quiet

      - name: Check cloud AI services are disabled
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.cloud.yml \
            config --format json > compose.json

          python3 - <<'PY'
          import json

          with open("compose.json") as file:
              config = json.load(file)

          flags = [
              "AI_MODE_ENABLED",
              "MCP_ENABLED",
              "RAG_ENABLED",
              "MULTI_AGENT_ENABLED",
          ]

          backends = [
              "staff-backend",
              "allocation-backend",
              "student3-backend",
              "student4-backend",
              "student5-backend",
          ]

          for backend in backends:
              environment = config["services"][backend]["environment"]

              for flag in flags:
                  value = str(environment.get(flag, "false")).lower()
                  assert value == "false", f"{backend}: {flag} enabled"

          print("PASS: Cloud AI services disabled")
          PY

      - name: Validate Nginx gateway
        run: |
          docker run --rm \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Validate Student 2 Nginx proxy
        run: |
          docker run --rm \
            -v "$PWD/student-2Hein-Htet-Aung/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

      - name: Validate deployment images
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.cloud.yml \
            build

      - name: Validation completed
        run: |
          echo "Cloud configuration validation passed."
          echo "Deployment is not enabled yet."
    
      - name: Start integrated cloud stack for CI
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.cloud.yml \
            up -d --wait

      - name: Test integrated frontend and API endpoints
        run: |
          set -euo pipefail

          check_url() {
            local url="$1"
            echo "Checking $url"
            curl --fail --silent --show-error \
              --retry 10 \
              --retry-delay 3 \
              --retry-all-errors \
              --max-time 15 \
              --output /dev/null \
              "$url"
          }

          for port in 80 8001 8002 8003 8004 8005; do
            check_url "http://127.0.0.1:$port/"
          done

          check_url "http://127.0.0.1:8001/api/staff"
          check_url "http://127.0.0.1:8002/subjects"
          check_url "http://127.0.0.1:8003/api/staff-workload/profiles"
          check_url "http://127.0.0.1:8004/projects"
          check_url "http://127.0.0.1:8005/api/development-goals"

          echo "PASS: Integrated cloud CI smoke tests"

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.cloud.yml \
            logs --tail=100

      - name: Stop CI containers
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.cloud.yml \
            down

  deploy:
    name: Deploy to AWS EC2 via SSM
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: faculty-aws-production
      cancel-in-progress: false

    env:
      INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
      AWS_REGION: ap-southeast-2

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Confirm AWS authentication
        run: aws sts get-caller-identity

      - name: Prepare EC2 deployment command
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import shlex

          sha = os.environ["GITHUB_SHA"]

          script = f"""#!/usr/bin/env bash
          set -Eeuo pipefail

          cd /home/ubuntu/faculty-management-system-ASD

          git diff --quiet
          git diff --cached --quiet

          git fetch origin main
          git switch main
          git merge --ff-only {shlex.quote(sha)}

          test "$(git rev-parse HEAD)" = {shlex.quote(sha)}

          echo "Deploying commit: {sha}"
          ./deploy/deploy.sh

          for port in 80 8001 8002 8003 8004 8005; do
            curl -fsS --max-time 15 \\
              "http://127.0.0.1:$port/" -o /dev/null
            echo "PASS: port $port"
          done

          curl -fsS --max-time 15 \\
            http://127.0.0.1:8002/subjects -o /dev/null

          echo "AWS DEPLOYMENT SUCCESSFUL"
          """

          encoded = base64.b64encode(script.encode()).decode()
          remote_path = "/tmp/faculty-gh-deploy.sh"
          log_path = "/tmp/faculty-gh-deploy.log"

          command = (
              f"printf '%s' {shlex.quote(encoded)} "
              f"| base64 -d > {remote_path} && "
              f"chmod 644 {remote_path} && "
              f"if runuser -u ubuntu -- bash {remote_path} "
              f"> {log_path} 2>&1; then "
              f"tail -n 100 {log_path}; "
              f"else tail -n 100 {log_path}; exit 1; fi"
          )

          with open("ssm-parameters.json", "w") as file:
              json.dump({"commands": [command]}, file)
          PY

      - name: Send deployment command to EC2
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Faculty Management Release 2 Deployment" \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for deployment and save results
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || echo Pending)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json > deployment-result.json

          jq -r '.StandardOutputContent' \
            deployment-result.json \
            | tee cloud-deployment-run.log

          jq -r '.StandardErrorContent' \
            deployment-result.json \
            | tee -a cloud-deployment-run.log

          jq -e '.Status == "Success"' \
            deployment-result.json

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-cloud-deployment-evidence
          path: |
            cloud-deployment-run.log
            deployment-result.json
          if-no-files-found: warn
