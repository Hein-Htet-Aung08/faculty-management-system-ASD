name: Student 1 CI

on:
  workflow_dispatch:
  push:
    branches: [ main, student-1-* ]
    paths:
      - 'student-1-Andy-Lam/**'
      - 'ai-services/mcp-server/**'
      - 'ai-services/rag-server/**'
      - 'ai-services/multi-agent-server/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-1-AndyLam.yml'
  pull_request:
    paths:
      - 'student-1-Andy-Lam/**'
      - 'ai-services/mcp-server/**'
      - 'ai-services/rag-server/**'
      - 'ai-services/multi-agent-server/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-1-AndyLam.yml'

env:
  STUDENT_DIR: student-1-Andy-Lam
  # AI-Mode, MCP, RAG and Multi-Agent integration stays in the code but is switched off in CI:
  # the shared servers (and Ollama) run on a developer's machine, not here.
  AI_MODE_ENABLED: 'false'
  MCP_ENABLED: 'false'
  RAG_ENABLED: 'false'
  MULTI_AGENT_ENABLED: 'false'
  BACKEND_PORT: '5001'
  FRONTEND_PORT: '8001'

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            student-1-Andy-Lam/backend/requirements.txt
            ai-services/rag-server/requirements.txt
            ai-services/multi-agent-server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$STUDENT_DIR/backend/requirements.txt"
          # Needed only to unit-test Student 1's loader inside the shared RAG pipeline
          pip install -r ai-services/rag-server/requirements.txt
          # Needed only to unit-test Student 1's evidence section of the shared Multi-Agent Server
          pip install -r ai-services/multi-agent-server/requirements.txt
          pip install pytest

      - name: Check backend imports correctly
        run: python -c "import sys; sys.path.insert(0, '$STUDENT_DIR/backend'); import app"

      # Release 2 post-commit testing: two endpoint functions of the Staff Management API
      - name: "Post-commit endpoint tests: GET /api/staff/<id> and POST /api/staff"
        run: python -m pytest "$STUDENT_DIR/tests/test_release2_endpoints.py" -v

      - name: Run remaining unit tests (AI-Mode/MCP/RAG/Multi-Agent faked or disabled)
        run: python -m pytest "$STUDENT_DIR/tests" -v --ignore="$STUDENT_DIR/tests/test_release2_endpoints.py"

      - name: Run shared Multi-Agent Server tests (includes Student 1 evidence)
        working-directory: ai-services/multi-agent-server
        run: python -m unittest discover -s tests -v

      - name: Validate docker-compose MCP/RAG configuration
        run: |
          docker compose config --format json > compose.json
          # Integration is retained: staff-backend is configured for the shared servers
          jq -e '.services["staff-backend"].environment
                 | .AI_MODE_ENABLED == "true"
                   and .MCP_ENABLED == "true"
                   and (.MCP_SERVER_URL | test("host.docker.internal:5201"))
                   and .RAG_ENABLED == "true"
                   and (.RAG_SERVER_URL | test("host.docker.internal:5200"))
                   and .MULTI_AGENT_ENABLED == "true"
                   and (.MULTI_AGENT_SERVER_URL | test("host.docker.internal:5202"))' compose.json
          # AI-Mode, MCP, RAG and Multi-Agent must not be defined as compose services for this feature
          jq -e '.services["staff-backend"].depends_on | keys == ["staff-database"]' compose.json
          echo "PASS: staff-backend points at host MCP/RAG/Multi-Agent and depends only on its own database"

      - name: Build database Docker image
        run: docker build -t staff-database "$STUDENT_DIR/database"

      - name: Build backend Docker image
        run: docker build -t staff-backend "$STUDENT_DIR/backend"

      - name: Build frontend Docker image
        run: docker build -t staff-frontend "$STUDENT_DIR/frontend"

      - name: Run containers and smoke test (AI-Mode/MCP/RAG/Multi-Agent disabled)
        run: |
          set -euo pipefail

          # Database image bakes a seeded staff.db; mounting an empty named
          # volume copies it in, the same way docker-compose shares it.
          docker volume create staff-ci-data
          docker run --rm -v staff-ci-data:/app staff-database true

          docker run -d --name staff-backend -p "$BACKEND_PORT:5001" \
            -v staff-ci-data:/app/data -e DB_PATH=/app/data/staff.db \
            -e AI_MODE_ENABLED -e MCP_ENABLED -e RAG_ENABLED -e MULTI_AGENT_ENABLED staff-backend
          docker run -d --name staff-frontend -p "$FRONTEND_PORT:80"             -e API_BASE="http://localhost:$BACKEND_PORT" staff-frontend

          API="http://localhost:$BACKEND_PORT"
          for attempt in $(seq 1 30); do
            curl -fs "$API/api/departments" > /dev/null && break
            sleep 1
          done

          echo "--- Release 0: seeded data served through the backend container"
          curl -fs "$API/api/staff" | jq -e 'length >= 10'
          curl -fs "$API/api/staff/1" | jq -e '.name == "John Smith"'

          echo "--- AI-Mode/MCP/RAG/Multi-Agent reported disabled, routes refuse cleanly"
          curl -fs "$API/api/ai-services/status" | jq -e '. == {"ai_mode_enabled": false, "mcp_enabled": false, "rag_enabled": false, "multi_agent_enabled": false}'
          for route in staff/1/generate_analysis mcp/staff-profile rag/ask multi-agent/workflow; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d '{"staff_id": 1, "question": "test", "user_request": "test"}' "$API/api/$route")
            echo "POST /api/$route -> $code"
            test "$code" = "503"
          done

          echo "--- Frontend container serves the page and AI Assistant panel"
          curl -fs "http://localhost:$FRONTEND_PORT/" | grep -q 'id="ai-assistant"'
          curl -fs "http://localhost:$FRONTEND_PORT/" | grep -q 'id="multi-agent"'
          curl -fs "http://localhost:$FRONTEND_PORT/js/app.js" > /dev/null
          # API_BASE env var is written into config.js at container start
          curl -fs "http://localhost:$FRONTEND_PORT/js/config.js" | grep -q "http://localhost:$BACKEND_PORT"

          echo "PASS: Student 1 containers run with AI-Mode/MCP/RAG/Multi-Agent disabled"

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs staff-backend || true
          docker logs staff-frontend || true
