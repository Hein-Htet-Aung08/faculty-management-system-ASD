name: Student 2 CI

on:
  push:
    branches: [ main, student-2-* ]
    paths:
      - 'student-2Hein-Htet-Aung/**'
      - '.github/workflows/student-2-HeinHtetAung.yml'

  pull_request:
    paths:
      - 'student-2Hein-Htet-Aung/**'
      - '.github/workflows/student-2-HeinHtetAung.yml'

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r student-2Hein-Htet-Aung/backend/requirements.txt

      - name: Check backend imports correctly
        run: python -c "import sys; sys.path.insert(0, 'student-2Hein-Htet-Aung/backend'); import app"

      - name: Build database Docker image
        run: docker build -t allocation-database -f student-2Hein-Htet-Aung/database/Dockerfile student-2Hein-Htet-Aung

      - name: Build backend Docker image
        run: docker build -t allocation-backend -f student-2Hein-Htet-Aung/backend/Dockerfile student-2Hein-Htet-Aung

      - name: Build frontend Docker image
        run: docker build -t allocation-frontend -f student-2Hein-Htet-Aung/frontend/Dockerfile .