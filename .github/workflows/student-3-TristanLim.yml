name: student-3-TristanLim

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - student-3-tristan-workload-and-availability-management
    paths:
      - "student-3Tristan-Lim/**"
      - ".github/workflows/student-3-TristanLim.yml"
  pull_request:
    paths:
      - "student-3Tristan-Lim/**"

env:
  STUDENT_DIR: student-3Tristan-Lim
  DATABASE_PORT: "5302"
  BACKEND_PORT: "5301"
  FRONTEND_PORT: "8083"

jobs:

  # ------------------------------------------------------------------ build ---

  build-images:
    name: Build microservice images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python3 -m compileall -q "$STUDENT_DIR/backend-service" "$STUDENT_DIR/database-service"
          echo "PASS all Python modules compile"

      - name: Build database-service
        run: docker build -t s3-db:ci "$STUDENT_DIR/database-service"

      - name: Build backend-service
        # Build context is the student directory so the sibling prompts/ tree
        # is included in the image.
        run: docker build -t s3-be:ci -f "$STUDENT_DIR/backend-service/Dockerfile" "$STUDENT_DIR"

      - name: Build frontend-service
        run: docker build -t s3-fe:ci "$STUDENT_DIR/frontend-service"

      - name: List built images
        run: docker images --filter "reference=s3-*:ci"

  # ------------------------------------------------------------- smoke test ---

  smoke-test:
    name: Run and validate services
    runs-on: ubuntu-latest
    needs: [build-images]

    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t s3-db:ci "$STUDENT_DIR/database-service"
          docker build -t s3-be:ci -f "$STUDENT_DIR/backend-service/Dockerfile" "$STUDENT_DIR"
          docker build -t s3-fe:ci "$STUDENT_DIR/frontend-service"

      - name: Start services
        run: |
          docker network create s3-net
          docker run -d --name s3-db --network s3-net -p ${DATABASE_PORT}:5302 s3-db:ci
          docker run -d --name s3-be --network s3-net -p ${BACKEND_PORT}:5301 \
            -e DATABASE_SERVICE_URL=http://s3-db:5302 \
            -e OLLAMA_BASE_URL=http://127.0.0.1:11434/v1 \
            -e LLM_TIMEOUT=5 \
            s3-be:ci
          docker run -d --name s3-fe --network s3-net -p ${FRONTEND_PORT}:80 \
            -e BACKEND_URL=http://localhost:${BACKEND_PORT} s3-fe:ci

      - name: Wait for services
        run: |
          wait_for() {
            name="$1"; url="$2"
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$url" || true)
              if [ "$code" = "200" ]; then echo "PASS $name ready ($url)"; return 0; fi
              echo "  waiting for $name ($i/20, last: ${code:-none})"
              sleep 2
            done
            echo "FAIL $name never became ready"
            docker logs "$3" || true
            return 1
          }

          wait_for "database-service" "http://localhost:${DATABASE_PORT}/health" s3-db
          wait_for "backend-service"  "http://localhost:${BACKEND_PORT}/health"  s3-be
          wait_for "frontend-service" "http://localhost:${FRONTEND_PORT}/index.html" s3-fe

      - name: Verify seed data meets the ten record minimum
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request

          PORT = os.environ["DATABASE_PORT"]
          TABLES = [
              "staff_workload_profile", "workload_entry", "availability_slot",
              "leave_record", "workload_rule", "workload_alert",
              "rebalance_recommendation",
          ]

          failed = False
          for table in TABLES:
              with urllib.request.urlopen(f"http://localhost:{PORT}/{table}") as response:
                  count = len(json.load(response))
              ok = count >= 10
              failed |= not ok
              print(f"{'PASS' if ok else 'FAIL'} {table}: {count} records")

          sys.exit(1 if failed else 0)
          PY

      - name: Validate workload analysis endpoints
        run: |
          check() {
            name="$1"; url="$2"; expect="$3"
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 20 "$url" || true)
            if [ "$code" != "$expect" ]; then
              echo "FAIL $name -> $code (expected $expect)"; head -c 400 /tmp/body; echo; return 1
            fi
            echo "PASS $name -> $code"
          }

          check "analysis (all staff)"  "http://localhost:${BACKEND_PORT}/analysis"              200
          check "analysis (staff 1)"    "http://localhost:${BACKEND_PORT}/analysis?staff_id=1"   200
          check "analysis (unknown)"    "http://localhost:${BACKEND_PORT}/analysis?staff_id=999" 404
          check "clashes"               "http://localhost:${BACKEND_PORT}/clashes"               200
          check "calendar"              "http://localhost:${BACKEND_PORT}/calendar?staff_id=1"   200
          check "calendar (no staff)"   "http://localhost:${BACKEND_PORT}/calendar"              400
          check "alerts"                "http://localhost:${BACKEND_PORT}/alerts"                200
          check "profiles"              "http://localhost:${BACKEND_PORT}/profiles"              200

      - name: Validate CRUD operations
        run: |
          BASE="http://localhost:${BACKEND_PORT}"

          echo "CREATE"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/availability?staff_id=99" \
            -d "staff_id=99&day_of_week=Mon&start_time=09:00&end_time=12:00&availability=available&is_recurring=1")
          [ "$code" = "201" ] || { echo "FAIL create -> $code"; exit 1; }
          echo "PASS create -> 201"

          ROW_ID=$(curl -s "http://localhost:${DATABASE_PORT}/availability_slot?staff_id=99" \
            | python3 -c "import json,sys; print(max(r['slot_id'] for r in json.load(sys.stdin)))")
          echo "  created slot_id=$ROW_ID"

          echo "READ"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/availability/$ROW_ID/record")
          [ "$code" = "200" ] || { echo "FAIL read -> $code"; exit 1; }
          python3 -c "
          import json, urllib.request
          row = json.load(urllib.request.urlopen('$BASE/availability/$ROW_ID/record'))
          assert row['day_of_week'] == 'Mon', row
          assert row['availability'] == 'available', row
          "
          echo "PASS read -> 200"

          echo "UPDATE"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X PUT "$BASE/availability/$ROW_ID?staff_id=99" \
            -d "staff_id=99&day_of_week=Fri&start_time=13:00&end_time=17:00&availability=preferred&is_recurring=1")
          [ "$code" = "200" ] || { echo "FAIL update -> $code"; exit 1; }
          python3 -c "
          import json, urllib.request
          row = json.load(urllib.request.urlopen('$BASE/availability/$ROW_ID/record'))
          assert row['day_of_week'] == 'Fri', row
          assert row['availability'] == 'preferred', row
          "
          echo "PASS update -> 200"

          echo "DELETE"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "$BASE/availability/$ROW_ID?staff_id=99")
          [ "$code" = "200" ] || { echo "FAIL delete -> $code"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/availability/$ROW_ID/record")
          [ "$code" = "404" ] || { echo "FAIL record still present -> $code"; exit 1; }
          echo "PASS delete -> 200, record gone"

      - name: Validate alert recomputation is idempotent
        run: |
          BASE="http://localhost:${BACKEND_PORT}"
          count() { curl -s "http://localhost:${DATABASE_PORT}/workload_alert" \
                    | python3 -c "import json,sys; print(len(json.load(sys.stdin)))"; }

          curl -s -X POST "$BASE/alerts/recompute" -o /dev/null --max-time 60
          first=$(count)
          curl -s -X POST "$BASE/alerts/recompute" -o /dev/null --max-time 60
          second=$(count)

          echo "  alerts after first recompute: $first"
          echo "  alerts after second recompute: $second"
          [ "$first" = "$second" ] || { echo "FAIL recompute duplicated alerts"; exit 1; }
          echo "PASS recompute is idempotent"

      - name: Validate AI-Mode degrades cleanly without an LLM runtime
        run: |
          # No Ollama on the runner. AI-Mode must report the failure rather than
          # returning a 500 or hanging.
          code=$(curl -s -o /tmp/ai -w "%{http_code}" --max-time 90 \
                 "http://localhost:${BACKEND_PORT}/ai/health" || true)
          if [ "$code" != "503" ]; then
            echo "FAIL expected 503 when the LLM is unreachable, got $code"
            head -c 400 /tmp/ai; echo
            exit 1
          fi
          grep -q "LLM unreachable" /tmp/ai || { echo "FAIL unexpected body"; cat /tmp/ai; exit 1; }
          echo "PASS AI-Mode returned 503 with a clear message"

      - name: Verify prompts are packaged in the backend image
        run: |
          docker exec s3-be sh -c "ls /app/prompts/service/implementation/system_prompt.txt \
                                      /app/prompts/service/review/rebalance_review_prompt.txt"
          echo "PASS prompt files present in the image"

      - name: Verify frontend assets
        run: |
          for path in /index.html /tabs/normal.html /tabs/ai-mode.html /js/api.js /js/config.js; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${FRONTEND_PORT}$path")
            [ "$code" = "200" ] || { echo "FAIL $path -> $code"; exit 1; }
            echo "PASS $path -> 200"
          done
          curl -s "http://localhost:${FRONTEND_PORT}/js/config.js" | grep -q "BACKEND_URL" \
            || { echo "FAIL backend URL not injected"; exit 1; }
          echo "PASS backend URL injected by entrypoint"

      - name: Service logs
        if: always()
        run: |
          echo "===== database-service ====="; docker logs s3-db 2>&1 | tail -30
          echo "===== backend-service ====="; docker logs s3-be 2>&1 | tail -30
          echo "===== frontend-service ====="; docker logs s3-fe 2>&1 | tail -30

      - name: Stop services
        if: always()
        run: |
          docker rm -f s3-db s3-be s3-fe || true
          docker network rm s3-net || true

  # ---------------------------------------------------------------- evidence ---

  evidence-pack:
    name: Generate CI evidence
    runs-on: ubuntu-latest
    needs: [smoke-test]

    steps:
      - uses: actions/checkout@v4

      - name: Generate reports
        run: |
          mkdir -p reports

          cat > reports/report.json <<EOF
          {
            "workflow": "student-3-TristanLim",
            "student": "Tristan Lim",
            "feature": "Workload and Availability Management",
            "services": ["frontend-service", "backend-service", "database-service"],
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "generated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          cat > reports/report.md <<EOF
          # Student 3 CI Report - Workload and Availability Management

          | Field | Value |
          | --- | --- |
          | Workflow | student-3-TristanLim |
          | Run ID | ${{ github.run_id }} |
          | Commit | ${{ github.sha }} |
          | Branch | ${{ github.ref_name }} |
          | Generated | $(date -u +%Y-%m-%dT%H:%M:%SZ) |

          ## Validated in this run

          - All Python modules compile
          - frontend-service, backend-service and database-service images build
          - All three services start and report healthy
          - Every database table holds at least ten records
          - Workload analysis, clash detection and calendar endpoints respond
          - Full CRUD cycle: create, read, update, delete
          - Alert recomputation is idempotent
          - AI-Mode degrades cleanly when no LLM runtime is reachable
          - Prompt files are packaged inside the backend image
          - Frontend assets served and backend URL injected at container start

          ## Not covered here

          The Ollama runtime is not available on a GitHub Actions runner, so the
          Frontend -> Backend -> Ollama -> LLM path and the
          Plan -> Act -> Observe -> Adapt cycle are demonstrated locally instead.
          EOF

          cat > reports/run-view.md <<EOF
          Run URL:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          cat reports/report.md

      - uses: actions/upload-artifact@v4
        with:
          name: student-3-ci-report
          path: reports/
