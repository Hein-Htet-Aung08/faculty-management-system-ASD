name: Student 4 - Nicholas Hatzidimitriou (Research & Grant Management)

on:
  push:
    branches: [main, "student-4-*"]
    paths:
      - "student-4Nicholas-Hatzidimitriou/**"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "ai-services/multi-agent-server/**"
      - "tests/post_commit/student4/**"
      - "docker-compose.yml"
      - ".github/workflows/student-4-NicholasHatzidimitriou.yml"
  pull_request:
    branches: [main]
    paths:
      - "student-4Nicholas-Hatzidimitriou/**"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "ai-services/multi-agent-server/**"
      - "tests/post_commit/student4/**"
      - "docker-compose.yml"
      - ".github/workflows/student-4-NicholasHatzidimitriou.yml"

env:
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"
  MULTI_AGENT_ENABLED: "false"

jobs:
  validate-python:
    name: Validate Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: student-4Nicholas-Hatzidimitriou/backend
        run: pip install --no-cache-dir -r requirements.txt

      - name: Compile-check backend
        working-directory: student-4Nicholas-Hatzidimitriou/backend
        run: python -m compileall -q .

      - name: Install database-service dependencies
        working-directory: student-4Nicholas-Hatzidimitriou/database-service
        run: pip install --no-cache-dir -r requirements.txt

      - name: Compile-check database-service
        working-directory: student-4Nicholas-Hatzidimitriou/database-service
        run: python -m compileall -q .

      - name: Install frontend dependencies
        working-directory: student-4Nicholas-Hatzidimitriou/frontend
        run: pip install --no-cache-dir -r requirements.txt

      - name: Compile-check frontend
        working-directory: student-4Nicholas-Hatzidimitriou/frontend
        run: python -m compileall -q .

  validate-database-init:
    name: Validate database initialises and seeds correctly
    runs-on: ubuntu-latest
    needs: validate-python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install database-service dependencies
        working-directory: student-4Nicholas-Hatzidimitriou/database-service
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run init_db.py and seed.py
        working-directory: student-4Nicholas-Hatzidimitriou/database-service
        run: |
          mkdir -p /tmp/ci-data
          DATA_DIR=/tmp/ci-data python init_db.py
          DATA_DIR=/tmp/ci-data python seed.py

      - name: Verify seeded record counts
        working-directory: student-4Nicholas-Hatzidimitriou/database-service
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect('/tmp/ci-data/student4.db')
          tables = ['ResearchProjects', 'Grants', 'Publications', 'ProjectStaff', 'GrantAlerts', 'ResearchAIAnalysis']
          for t in tables:
              count = conn.execute(f'SELECT COUNT(*) FROM {t}').fetchone()[0]
              assert count >= 10, f'{t} has only {count} records, expected at least 10'
              print(f'{t}: {count} records OK')
          "

  validate-mcp-rag-compose-config:
    name: Validate shared MCP/RAG wiring in docker-compose.yml
    runs-on: ubuntu-latest
    needs: validate-python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate student4-backend points at the shared host MCP/RAG/Multi-Agent servers
        run: |
          docker compose -f docker-compose.yml config --format json > compose.json
          jq -e '.services["student4-backend"].environment
                 | .MCP_ENABLED == "true"
                   and (.MCP_SERVER_URL | test("host.docker.internal:5201"))
                   and .RAG_ENABLED == "true"
                   and (.RAG_SERVER_URL | test("host.docker.internal:5200"))
                   and .MULTI_AGENT_ENABLED == "true"
                   and (.MULTI_AGENT_SERVER_URL | test("host.docker.internal:5202"))' compose.json
          jq -e '.services["student4-backend"].depends_on | keys == ["student4-database"]' compose.json
          echo "PASS: student4-backend points at host MCP/RAG/Multi-Agent and depends only on its own database"

  build-docker-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: validate-python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t student4-backend:ci ./student-4Nicholas-Hatzidimitriou/backend

      - name: Build frontend image
        run: docker build -t student4-frontend:ci ./student-4Nicholas-Hatzidimitriou/frontend

      - name: Build database-service image
        run: docker build -t student4-database:ci ./student-4Nicholas-Hatzidimitriou/database-service

  smoke-test-mcp-rag-disabled:
    name: Runtime smoke test (MCP/RAG disabled)
    runs-on: ubuntu-latest
    needs: build-docker-images
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t student4-backend:ci ./student-4Nicholas-Hatzidimitriou/backend
          docker build -t student4-database:ci ./student-4Nicholas-Hatzidimitriou/database-service

      - name: Create isolated CI network
        run: docker network create student4-ci-network

      - name: Start database service
        run: |
          docker run -d --name student4-database-ci --network student4-ci-network \
            -p 5104:5104 student4-database:ci

      - name: Start backend service (MCP/RAG disabled)
        run: |
          docker run -d --name student4-backend-ci --network student4-ci-network \
            -p 5004:5004 \
            -e DATABASE_SERVICE_URL=http://student4-database-ci:5104 \
            -e STAFF_SERVICE_URL=http://unavailable-staff-service:5001 \
            -e WORKLOAD_SERVICE_URL=http://unavailable-workload-service:5003 \
            -e OLLAMA_BASE_URL=http://unavailable-ollama:11434/v1 \
            -e OLLAMA_MODEL=qwen2.5:0.5b \
            -e MCP_ENABLED=false \
            -e MCP_SERVER_URL=http://unavailable-mcp:5201/mcp \
            -e RAG_ENABLED=false \
            -e RAG_SERVER_URL=http://unavailable-rag:5200 \
            -e MULTI_AGENT_ENABLED=false \
            -e MULTI_AGENT_SERVER_URL=http://unavailable-multi-agent:5202 \
            student4-backend:ci

      - name: Wait for backend health check
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5004/health || true)
            if [ "$code" = "200" ]; then
              echo "PASS: backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... attempt $attempt"
            sleep 2
          done
          echo "Backend failed to become healthy"
          docker logs student4-backend-ci || true
          exit 1

      - name: Verify seeded project data is served
        run: |
          count=$(curl -fs http://localhost:5004/projects | jq -e 'length')
          echo "Projects returned: $count"
          test "$count" -ge 10
          echo "PASS: at least 10 seeded projects returned via the backend container"

      - name: Verify MCP is retained but cleanly disabled
        run: |
          code=$(curl -s -o /tmp/mcp-disabled -w '%{http_code}' \
            -X POST -H 'X-MCP-Mode: on' http://localhost:5004/mcp/project-count || true)
          if [ "$code" != "403" ]; then
            echo "FAIL: MCP expected HTTP 403, got $code"
            cat /tmp/mcp-disabled || true
            exit 1
          fi
          grep -q "MCP mode is off" /tmp/mcp-disabled
          echo "PASS: MCP integration retained but disabled during CI"

      - name: Verify RAG is retained but cleanly disabled
        run: |
          code=$(curl -s -o /tmp/rag-disabled -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"query":"What is the Financial Risk Modelling with AI project about?"}' \
            http://localhost:5004/api/rag/ask || true)
          if [ "$code" != "403" ]; then
            echo "FAIL: RAG expected HTTP 403, got $code"
            cat /tmp/rag-disabled || true
            exit 1
          fi
          grep -q "RAG mode is off" /tmp/rag-disabled
          echo "PASS: RAG integration retained but disabled during CI"

      - name: Verify Multi-Agent integration is retained but cleanly disabled
        run: |
          code=$(curl -s -o /tmp/multi-agent-disabled -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"user_request":"Summarise the active research projects"}' \
            http://localhost:5004/api/multi-agent/workflow || true)
          if [ "$code" != "403" ]; then
            echo "FAIL: Multi-Agent expected HTTP 403, got $code"
            cat /tmp/multi-agent-disabled || true
            exit 1
          fi
          grep -q "Multi-agent mode is off" /tmp/multi-agent-disabled
          echo "PASS: Multi-Agent integration retained but disabled during CI"

      - name: Set up Python for post-commit endpoint tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install post-commit test dependencies
        run: pip install --no-cache-dir pytest==9.1.1 requests==2.33.0

      - name: Run post-commit endpoint tests
        env:
          BACKEND_URL: http://localhost:5004
        run: |
          set +e
          pytest tests/post_commit/student4/test_student4_endpoints.py -v | tee /tmp/post-commit-test-output.txt
          echo "PYTEST_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          set -e

      - name: Write post-commit test results and audit evidence
        if: always()
        run: |
          mkdir -p reports/release2/student4
          STATUS="PASS"
          if [ "${PYTEST_EXIT:-1}" != "0" ]; then
            STATUS="FAIL"
          fi
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          {
            echo "# Student 4 Post-Commit Endpoint Test Results"
            echo ""
            echo "- Date: $TIMESTAMP"
            echo "- Backend URL: http://localhost:5004 (running container, MCP/RAG/Multi-Agent disabled)"
            echo "- Endpoints tested: GET /projects, GET /projects/<id> (known id and unknown-id 404 case)"
            echo "- Status: $STATUS"
            echo ""
            echo '```'
            cat /tmp/post-commit-test-output.txt 2>/dev/null || echo "(tests did not run - an earlier step in this job failed)"
            echo '```'
          } > reports/release2/student4/post-commit-test-results.md

          printf '{"status": "%s", "timestamp": "%s"}\n' "$STATUS" "$TIMESTAMP" >> reports/release2/student4/post-commit-audit.jsonl

          if [ "$STATUS" = "FAIL" ]; then
            echo "FAIL: post-commit endpoint tests failed - see reports/release2/student4/post-commit-test-results.md"
            exit 1
          fi
          echo "PASS: post-commit endpoint tests, results written to reports/release2/student4/post-commit-test-results.md"

      - name: Upload post-commit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student4-post-commit-test-evidence
          path: |
            reports/release2/student4/post-commit-test-results.md
            reports/release2/student4/post-commit-audit.jsonl

      - name: Collect container logs on failure
        if: failure()
        run: |
          docker logs student4-backend-ci || true
          docker logs student4-database-ci || true

      - name: Clean up CI containers
        if: always()
        run: |
          docker rm -f student4-backend-ci student4-database-ci 2>/dev/null || true
          docker network rm student4-ci-network 2>/dev/null || true
