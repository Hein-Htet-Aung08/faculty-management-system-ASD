name: Matthew - Performance and Professional Development

on:
  push:
    paths:
      - "student-5Matthew-Barnard/**"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "ai-services/multi-agent-server/**"
      - "docker-compose.yml"
      - ".github/workflows/student-5-MatthewBarnard.yml"
  pull_request:
    paths:
      - "student-5Matthew-Barnard/**"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "ai-services/multi-agent-server/**"
      - "docker-compose.yml"
      - ".github/workflows/student-5-MatthewBarnard.yml"
  workflow_dispatch:

env:
  AI_MODE_ENABLED: "false"
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"
  MULTI_AGENT_ENABLED: "false"

jobs:
  test:
    name: Unit and API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            student-5Matthew-Barnard/backend-service/requirements.txt
            student-5Matthew-Barnard/database-service/requirements.txt
            student-5Matthew-Barnard/requirements-dev.txt
            ai-services/rag-server/requirements.txt
            ai-services/multi-agent-server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r student-5Matthew-Barnard/backend-service/requirements.txt
          python -m pip install -r student-5Matthew-Barnard/database-service/requirements.txt
          python -m pip install -r ai-services/rag-server/requirements.txt
          python -m pip install -r ai-services/multi-agent-server/requirements.txt
          python -m pip install -r student-5Matthew-Barnard/requirements-dev.txt

      - name: Validate security hook configuration
        run: python -m pre_commit validate-config student-5Matthew-Barnard/.pre-commit-config.yaml

      - name: "Post-commit endpoint tests: GET and POST /api/development-goals"
        run: |
          mkdir -p student-5Matthew-Barnard/reports/release2
          set -o pipefail
          python -m pytest student-5Matthew-Barnard/tests/test_release2_endpoints.py -v \
            --junitxml=student-5Matthew-Barnard/reports/release2/endpoint-tests.xml \
            2>&1 | tee student-5Matthew-Barnard/reports/release2/endpoint-tests.txt

      - name: Upload endpoint test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-5-release-2-endpoint-tests
          path: |
            student-5Matthew-Barnard/reports/release2/endpoint-tests.txt
            student-5Matthew-Barnard/reports/release2/endpoint-tests.xml

      - name: Test database service
        working-directory: student-5Matthew-Barnard/database-service
        run: python -m unittest discover -s tests -v

      - name: Test backend and AI endpoint
        working-directory: student-5Matthew-Barnard/backend-service
        run: python -m unittest discover -s tests -v

      - name: Test Student 5 shared MCP tools
        working-directory: ai-services/mcp-server
        run: python -m unittest discover -s tests -v

      - name: Test Student 5 RAG context
        working-directory: ai-services/rag-server
        run: python -m unittest discover -s tests -v

      - name: Test shared Multi-Agent workflows and Student 5 evidence
        working-directory: ai-services/multi-agent-server
        run: python -m unittest discover -s tests -v

  smoke-test:
    name: Build and smoke-test containers
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          docker compose -f student-5Matthew-Barnard/docker-compose.yml config
          docker compose -f student-5Matthew-Barnard/docker-compose.yml config --format json | python -c 'import json,sys; c=json.load(sys.stdin); e=c["services"]["student5-backend"]["environment"]; assert all(e[key] == "true" for key in ["AI_MODE_ENABLED", "MCP_ENABLED", "RAG_ENABLED", "MULTI_AGENT_ENABLED"]); assert e["RAG_SERVER_URL"].endswith(":5200") and e["MULTI_AGENT_SERVER_URL"] == "http://host.docker.internal:5202"; assert not {"ollama", "mcp-server", "rag-server", "multi-agent-server"}.intersection(c["services"])'
          docker compose config --format json | python -c 'import json,sys; c=json.load(sys.stdin); e=c["services"]["student5-backend"]["environment"]; assert all(e[key] == "true" for key in ["AI_MODE_ENABLED", "MCP_ENABLED", "RAG_ENABLED", "MULTI_AGENT_ENABLED"]); assert e["MCP_SERVER_URL"].endswith(":5201/mcp") and e["RAG_SERVER_URL"].endswith(":5200") and e["MULTI_AGENT_SERVER_URL"] == "http://host.docker.internal:5202"; assert not {"ollama", "mcp-server", "rag-server", "multi-agent-server"}.intersection(c["services"])'

      - name: Build all three feature services
        run: |
          docker build -t student5-database:ci student-5Matthew-Barnard/database-service
          docker build -t student5-backend:ci student-5Matthew-Barnard/backend-service
          docker build -t student5-frontend:ci student-5Matthew-Barnard/frontend-service

      - name: Start isolated test stack
        run: |
          docker network create student5-ci
          docker run -d --name student5-database --network student5-ci -p 5105:5105 \
            -e PORT=5105 -e DATABASE_PATH=/app/data/performance_dev.db student5-database:ci
          docker run -d --name student5-backend --network student5-ci -p 5005:5005 \
            -e PORT=5005 -e DATABASE_SERVICE_URL=http://student5-database:5105 \
            -e OLLAMA_BASE_URL=http://127.0.0.1:11434/v1 -e LLM_TIMEOUT=5 \
            -e AI_MODE_ENABLED=false -e MCP_ENABLED=false -e RAG_ENABLED=false \
            -e MULTI_AGENT_ENABLED=false student5-backend:ci
          docker run -d --name student5-frontend --network student5-ci -p 8005:80 \
            -v "$PWD/shared/frontend/css:/usr/share/nginx/html/css:ro" student5-frontend:ci

      - name: Wait for services
        run: |
          wait_for() {
            name="$1"; url="$2"; container="$3"
            for attempt in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$url" || true)
              if [ "$code" = "200" ]; then echo "PASS $name ready"; return 0; fi
              sleep 2
            done
            echo "FAIL $name did not become ready"
            docker logs "$container" || true
            return 1
          }
          wait_for database http://localhost:5105/health student5-database
          wait_for backend http://localhost:5005/health student5-backend
          wait_for frontend http://localhost:8005/ student5-frontend

      - name: Verify seed counts and all resource endpoints
        run: |
          python - <<'PY'
          import json
          import urllib.request

          expected_tables = {
              "PerformanceReviews", "DevelopmentGoals", "TrainingPrograms",
              "StaffTraining", "DevelopmentRecommendations",
          }
          with urllib.request.urlopen("http://localhost:5105/health") as response:
              counts = json.load(response)["tableCounts"]
          assert set(counts) == expected_tables, counts
          assert all(count >= 10 for count in counts.values()), counts

          resources = [
              "performance-reviews", "development-goals", "training-programs",
              "staff-training", "development-recommendations",
          ]
          for resource in resources:
              with urllib.request.urlopen(f"http://localhost:8005/api/{resource}") as response:
                  rows = json.load(response)
              assert len(rows) >= 10, (resource, len(rows))
              print(f"PASS {resource}: {len(rows)} records")
          PY

      - name: Verify CRUD through the frontend proxy
        run: |
          created=$(curl -fsS -X POST http://localhost:8005/api/development-goals \
            -H 'Content-Type: application/json' \
            -d '{"staffID":1,"title":"CI verification goal","status":"Planned","progress":0}')
          goal_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["goalID"])' <<< "$created")

          updated=$(curl -fsS -X PUT "http://localhost:8005/api/development-goals/$goal_id" \
            -H 'Content-Type: application/json' -d '{"progress":25,"status":"In Progress"}')
          python -c 'import json,sys; row=json.load(sys.stdin); assert row["progress"] == 25 and row["status"] == "In Progress"' <<< "$updated"

          code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            "http://localhost:8005/api/development-goals/$goal_id")
          [ "$code" = "204" ] || { echo "FAIL delete returned $code"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://localhost:8005/api/development-goals/$goal_id")
          [ "$code" = "404" ] || { echo "FAIL deleted record returned $code"; exit 1; }
          echo "PASS create, read/update, and delete lifecycle"

      - name: Verify frontend and AI-Mode disabled in CI
        run: |
          for asset in / /app.js /styles.css /css/styles.css; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8005$asset")
            [ "$code" = "200" ] || { echo "FAIL $asset returned $code"; exit 1; }
          done
          curl -fsS http://localhost:8005/ | grep -q 'RAG Questions'
          curl -fsS http://localhost:8005/ | grep -q 'Multi-Agent'
          code=$(curl -s -o /tmp/ai-response -w "%{http_code}" http://localhost:8005/api/ai/health)
          [ "$code" = "503" ] || { cat /tmp/ai-response; exit 1; }
          grep -q 'AI-Mode is disabled' /tmp/ai-response
          code=$(curl -s -o /tmp/ai-recommend-response -w "%{http_code}" \
            -X POST -H 'Content-Type: application/json' -d '{"staffID":1}' \
            http://localhost:8005/api/ai/recommend-development)
          [ "$code" = "503" ] || { cat /tmp/ai-recommend-response; exit 1; }
          echo "PASS frontend assets and AI-Mode disabled in CI"

      - name: Verify MCP remains disabled in CI
        run: |
          curl -fsS http://localhost:8005/api/mcp/status | python -c 'import json,sys; assert json.load(sys.stdin)["enabled"] is False'
          code=$(curl -s -o /tmp/student5-mcp-response -w "%{http_code}" \
            -X POST -H 'Content-Type: application/json' -d '{"staffID":1}' \
            http://localhost:8005/api/mcp/development-summary)
          [ "$code" = "503" ] || { cat /tmp/student5-mcp-response; exit 1; }
          grep -q 'MCP integration is disabled' /tmp/student5-mcp-response
          echo "PASS MCP integration is present and disabled in CI"

      - name: Verify RAG remains disabled in CI
        run: |
          curl -fsS http://localhost:8005/api/rag/status | python -c 'import json,sys; assert json.load(sys.stdin)["enabled"] is False'
          code=$(curl -s -o /tmp/student5-rag-response -w "%{http_code}" \
            -X POST -H 'Content-Type: application/json' \
            -d '{"query":"What is the leadership goal?"}' \
            http://localhost:8005/api/rag/ask)
          [ "$code" = "503" ] || { cat /tmp/student5-rag-response; exit 1; }
          grep -q 'RAG integration is disabled' /tmp/student5-rag-response
          code=$(curl -s -o /tmp/student5-rag-refresh-response -w "%{http_code}" \
            -X POST http://localhost:8005/api/rag/refresh)
          [ "$code" = "503" ] || { cat /tmp/student5-rag-refresh-response; exit 1; }
          echo "PASS RAG integration is present and disabled in CI"

      - name: Verify Multi-Agent remains disabled in CI
        run: |
          curl -fsS http://localhost:8005/api/multi-agent/status | python -c 'import json,sys; assert json.load(sys.stdin)["enabled"] is False'
          for path in /api/multi-agent/workflow /api/multi-agent/workflow/test/decision; do
            code=$(curl -s -o /tmp/student5-multi-agent-response -w "%{http_code}" \
              -X POST -H 'Content-Type: application/json' -d '{}' "http://localhost:8005$path")
            [ "$code" = "503" ] || { cat /tmp/student5-multi-agent-response; exit 1; }
            grep -q 'Multi-Agent integration is disabled' /tmp/student5-multi-agent-response
          done
          for path in /api/multi-agent/workflow/history /api/multi-agent/workflow/test; do
            code=$(curl -s -o /tmp/student5-multi-agent-response -w "%{http_code}" "http://localhost:8005$path")
            [ "$code" = "503" ] || { cat /tmp/student5-multi-agent-response; exit 1; }
          done
          echo "PASS Multi-Agent integration is present and disabled in CI"

      - name: Show service logs
        if: always()
        run: |
          docker logs student5-database 2>&1 | tail -30 || true
          docker logs student5-backend 2>&1 | tail -30 || true
          docker logs student5-frontend 2>&1 | tail -30 || true

      - name: Stop test stack
        if: always()
        run: |
          docker rm -f student5-frontend student5-backend student5-database || true
          docker network rm student5-ci || true

  evidence:
    name: Package CI evidence
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Download endpoint test results
        uses: actions/download-artifact@v4
        with:
          name: student-5-release-2-endpoint-tests
          path: evidence/endpoint-tests

      - name: Create evidence summary
        run: |
          mkdir -p evidence
          cat > evidence/student-5-ci-summary.md <<EOF
          # Student 5 Release 2 CI evidence

          - Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          This run validated Python tests, three Docker image builds, service health,
          ten-or-more seed records per table, all five resource endpoints, a complete
          CRUD lifecycle through the frontend proxy, frontend assets, and
          AI-Mode disabled behaviour. It also ran the dedicated GET and POST
          development-goal endpoint tests, Student 5 shared MCP tools, RAG context
          tests, shared Multi-Agent tests and Student 5 evidence tests. Local
          connection settings and disabled MCP, RAG and Multi-Agent modes were
          checked in the CI test stack. Endpoint results are included as text and XML.

          The shared agentic loop is outside this feature workflow and needs
          separate evidence from genuine local executions.
          EOF

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-5-release-2-ci-evidence
          path: evidence/
