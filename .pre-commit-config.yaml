repos:
  - repo: local
    hooks:
      - id: student4-ruff-security
        name: Student 4 - Ruff Security Scan
        entry: python student-4Nicholas-Hatzidimitriou/scripts/pre_commit_pytest.py student-4Nicholas-Hatzidimitriou/tests/pre_commit/test_ruff_scan.py -v
        language: python
        additional_dependencies: ["pytest==9.1.1", "ruff==0.17.1"]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: student4-detect-secrets
        name: Student 4 - Secret Detection
        entry: python student-4Nicholas-Hatzidimitriou/scripts/pre_commit_pytest.py student-4Nicholas-Hatzidimitriou/tests/pre_commit/test_secrets_scan.py -v
        language: python
        additional_dependencies: ["pytest==9.1.1", "detect-secrets==1.5.0"]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: student4-pip-audit
        name: Student 4 - Dependency Audit
        entry: python student-4Nicholas-Hatzidimitriou/scripts/pre_commit_pytest.py student-4Nicholas-Hatzidimitriou/tests/pre_commit/test_dependency_audit.py -v
        language: python
        additional_dependencies: ["pytest==9.1.1", "pip-audit==2.10.1"]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
