
# Public gateway for the integrated cloud application.
# Backend and database containers are not published to EC2.

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $home http://home:80;
        proxy_pass $home;
        proxy_set_header Host $host;

        # The local homepage contains localhost:8001-8005 links.
        # Rewrite them to the gateway's public hostname.
        proxy_set_header Accept-Encoding "";
        sub_filter 'http://localhost:' 'http://$host:';
        sub_filter_once off;
    }
}

# Student 1: Staff Management
server {
    listen 8001;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $staff_backend http://staff-backend:5001;
        proxy_pass $staff_backend;
    }

    location / {
        set $staff_frontend http://staff-frontend:80;
        proxy_pass $staff_frontend;

        # The page loads the shared theme and links home via localhost:8000.
        # In the cloud the home page is this gateway on port 80.
        proxy_set_header Accept-Encoding "";
        sub_filter 'http://localhost:8000' 'http://$host';
        sub_filter_once off;
    }
}

# Student 2: Teaching, Subject and Classroom Allocation
server {
    listen 8002;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(subjects|subject-offers|classrooms|teaching-allocations|staff-options|api)(/|$) {
        set $allocation_backend http://allocation-backend:5002;
        proxy_pass $allocation_backend;
    }

    location / {
        set $allocation_frontend http://allocation-frontend:80;
        proxy_pass $allocation_frontend;
    }
}

# Student 3: Workload and Availability Management
server {
    listen 8003;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(profiles|analysis|calendar|clashes|alerts|entries|availability|leave|export|staff|api)(/|$) {
        set $student3_backend http://student3-backend:5003;
        proxy_pass $student3_backend;
    }

    location / {
        set $student3_frontend http://student3-frontend:80;
        proxy_pass $student3_frontend;
        proxy_set_header Accept-Encoding "";
        sub_filter 'http://localhost:8000' 'http://$host';
        sub_filter_once off;
    }
}

# Student 4: Research and Grant Management
# Student 4's frontend already contains its own backend proxy.
server {
    listen 8004;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $student4_frontend http://student4-frontend:8004;
        proxy_pass $student4_frontend;
    }
}

# Student 5: Performance and Professional Development
# Student 5's frontend already proxies its /api paths.
server {
    listen 8005;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $student5_frontend http://student5-frontend:80;
        proxy_pass $student5_frontend;
    }
}
