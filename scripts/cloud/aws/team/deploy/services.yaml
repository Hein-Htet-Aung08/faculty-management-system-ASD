# Manifest-driven service list for the shared AWS cloud deployment.
#
# One entry under `stacks:` per student's app (frontend + backend + database,
# co-located in one ECS Fargate task - the "one task per stack" pattern from
# the Release 2 brief). `unified-home` is its own single-container stack.
#
# status: "ready"   - fully filled in, scripts will deploy it.
#         "todo"     - scripts skip it with a warning (or fail if STRICT=true
#                      is set) rather than guessing values. Fill in every
#                      field marked TODO(owner: ...) below, then flip this to
#                      "ready".
#
# Container ports are the port the process listens on INSIDE the container
# (Fargate's awsvpc mode has no host-port mapping like docker-compose does -
# this is not the same number as the "8001:80" style mapping in the local
# docker-compose.yml).
#
# Same-task container-to-container calls (e.g. backend -> its own database)
# use 127.0.0.1:<port> - all containers in one Fargate task share localhost.
# This was the actual cause of a real 502 error during Student 4's personal
# test: the nginx proxy was pointing at a Docker-Compose-only hostname that
# doesn't exist on Fargate. See the README's troubleshooting section.
#
# Cross-stack calls (e.g. Student 4's backend -> Student 1's staff backend)
# use the Cloud Map / ECS Service Connect alias in `service_connect_name`
# below, e.g. http://staff-backend:5001 - deploy.sh sets up a Service Connect
# namespace so these friendly names resolve, the same way Docker Compose
# service names do locally. Nobody should hardcode a task IP or an ALB DNS
# name here.
#
# ingress:
#   internal - reachable only from inside the VPC (every backend, every
#              database, every frontend except unified-home's own).
#   external - gets a public route through the Application Load Balancer.
#              Only unified-home should be external, per the brief's default
#              design (proxy_pass from unified-home to each frontend instead
#              of exposing five separate public endpoints).

project_prefix_default: faculty-fms
region_default: ap-southeast-2

stacks:
  - name: student4
    owner: "Student 4 - Nicholas"
    status: ready
    containers:
      - role: database
        container_name: student4-database
        service_connect_name: student4-database
        container_port: 5104
        ingress: internal
        build:
          context: .
          dockerfile: student-4Nicholas-Hatzidimitriou/database-service/Dockerfile
        env:
          PORT: "5104"
          DATA_DIR: /app/data
          FLASK_DEBUG: "false"

      - role: backend
        container_name: student4-backend
        service_connect_name: student4-backend
        container_port: 5004
        ingress: internal
        depends_on: [student4-database]
        build:
          context: .
          dockerfile: student-4Nicholas-Hatzidimitriou/backend/Dockerfile
        env:
          PORT: "5004"
          FLASK_DEBUG: "false"
          DATABASE_SERVICE_URL: "http://127.0.0.1:5104"
          STAFF_SERVICE_URL: "http://staff-backend:5001"
          WORKLOAD_SERVICE_URL: "http://student3-backend:5003"
          AI_MODE_ENABLED: "false"
          MCP_ENABLED: "false"
          RAG_ENABLED: "false"
          MULTI_AGENT_ENABLED: "false"

      - role: frontend
        container_name: student4-frontend
        service_connect_name: student4-frontend
        container_port: 8004
        ingress: internal
        depends_on: [student4-backend]
        build:
          context: .
          dockerfile: student-4Nicholas-Hatzidimitriou/frontend/Dockerfile
        env:
          FLASK_DEBUG: "false"
          # Same-task backend: 127.0.0.1, not a Service Connect name - this
          # container shares localhost with student4-backend above.
          STUDENT4_BACKEND_URL: "http://127.0.0.1:5004"
          # Cross-stack (Student 1's own task): Service Connect alias.
          STAFF_SERVICE_URL: "http://staff-backend:5001"

