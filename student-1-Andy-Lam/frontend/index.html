<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management</title>
    <link rel="stylesheet" href="http://localhost:8000/css/styles.css">
</head>
<body>

<header class="ledger-header feature-header">
    <div>
        <h1>Staff Management</h1>
        <p class="subtitle">Faculty Management System — Staff Directory</p>
    </div>
    <div class="feature-actions">
        <a class="btn secondary home-link" href="http://localhost:8000">&larr; All features</a>
    </div>
</header>

<main class="ledger-panel">

<section id="staff-list-section" class="panel-section">
    <h2>Staff Directory</h2>

    <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.5rem;">
        <input type="text" id="search-input" placeholder="Search by expertise..." style="font-family: var(--font-body); font-size: 0.92rem; padding: 0.5rem 0.6rem; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--paper); color: var(--ink);">
        <button id="search-btn" class="btn secondary">Search</button>

        <select id="department-filter" style="font-family: var(--font-body); font-size: 0.92rem; padding: 0.5rem 0.6rem; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--paper); color: var(--ink);">
            <option value="">All Departments</option>
        </select>
        <select id="position-filter" style="font-family: var(--font-body); font-size: 0.92rem; padding: 0.5rem 0.6rem; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--paper); color: var(--ink);">
            <option value="">All Positions</option>
        </select>
        <button id="filter-btn" class="btn secondary">Filter</button>

        <button id="add-staff-btn" class="btn" style="margin-left: auto;">Add New Staff</button>
    </div>

    <table id="staff-table" class="ledger-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Department</th>
                <th>Position</th>
                <th>Expertise</th>
                <th>Status</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="staff-table-body">
            <!-- rows get inserted here by JS -->
        </tbody>
    </table>
</section>

<section id="staff-detail-section" class="panel-section" style="display: none;">
    <button id="back-to-list-btn" class="btn secondary">← Back to list</button>
    <h2 id="detail-name"></h2>
    <p id="detail-info" style="font-family: var(--font-mono); font-size: 0.85rem; color: var(--ledger-green-dark);"></p>

    <h3>Qualifications</h3>
    <ul id="detail-qualifications"></ul>

    <h3>Expertise</h3>
    <ul id="detail-expertise"></ul>

    <h3>Availability</h3>
    <ul id="detail-availability"></ul>

    <h3>AI Suitability Analysis</h3>
    <div id="detail-ai-analysis" class="ai-result-panel"></div>
    <button id="generate-analysis-btn" class="btn" style="margin-top: 1rem;">Generate AI Analysis</button>
</section>

<section id="staff-form-section" class="panel-section" style="display: none;">
    <h2 id="form-title">Add New Staff</h2>
    <form id="staff-form">
        <div class="form-grid">
            <div class="form-field">
                <label for="form-name">Name</label>
                <input type="text" id="form-name" placeholder="Name" required>
            </div>
            <div class="form-field">
                <label for="form-email">Email</label>
                <input type="email" id="form-email" placeholder="Email" required>
            </div>
            <div class="form-field">
                <label for="form-phone">Phone</label>
                <input type="text" id="form-phone" placeholder="Phone">
            </div>
            <div class="form-field">
                <label for="form-department">Department</label>
                <select id="form-department" required></select>
            </div>
            <div class="form-field">
                <label for="form-expertise-area">Expertise Area</label>
                <input type="text" id="form-expertise-area" placeholder="Expertise Area" required>
            </div>
            <div class="form-field">
                <label for="form-skill-level">Skill Level (1-5)</label>
                <input type="number" id="form-skill-level" placeholder="Skill Level (1-5)" min="1" max="5" required>
            </div>
            <div class="form-field">
                <label for="form-position">Position</label>
                <input type="text" id="form-position" placeholder="Position" required>
            </div>
            <div class="form-field">
                <label for="form-employment-type">Employment Type</label>
                <select id="form-employment-type" required>
                    <option value="Full-time">Full-time</option>
                    <option value="Part-time">Part-time</option>
                    <option value="Casual">Casual</option>
                </select>
            </div>
            <div class="form-field">
                <label for="form-status">Status</label>
                <select id="form-status" required>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                    <option value="On Leave">On Leave</option>
                </select>
            </div>
        </div>
        <button type="submit" class="btn">Save</button>
        <button type="button" id="cancel-form-btn" class="btn secondary">Cancel</button>
    </form>
</section>

</main>

<script src="js/app.js"></script>
</body>
</html>
