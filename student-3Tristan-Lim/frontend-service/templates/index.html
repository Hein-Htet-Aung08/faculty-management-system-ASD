<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workload and Availability Management</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="app-shell">
    <header class="app-header">
        <h1>Workload and Availability Management</h1>
        <p>Faculty Management System &middot; Student 3 &middot; Tristan Lim</p>
    </header>

    <section class="tab-shell card">
        <nav class="tab-nav" aria-label="Feature tabs">
            <button class="tab-btn is-active" data-tab="normal" type="button">Dashboard</button>
            <button class="tab-btn" data-tab="ai-mode" type="button">AI Mode</button>
        </nav>

        <div class="tab-content">
            <iframe id="tab-frame-normal" class="tab-frame is-active"
                    src="tabs/normal.html" title="Workload dashboard"></iframe>
            <iframe id="tab-frame-ai-mode" class="tab-frame"
                    src="tabs/ai-mode.html" title="AI Mode"></iframe>
        </div>
    </section>
</main>

<script>
const tabButtons = Array.from(document.querySelectorAll(".tab-btn"));
const tabFrames = {
    normal: document.getElementById("tab-frame-normal"),
    "ai-mode": document.getElementById("tab-frame-ai-mode"),
};

function activateTab(tabName) {
    tabButtons.forEach((button) => {
        button.classList.toggle("is-active", button.dataset.tab === tabName);
    });

    Object.entries(tabFrames).forEach(([name, frame]) => {
        frame.classList.toggle("is-active", name === tabName);
    });

    window.location.hash = tabName;
}

tabButtons.forEach((button) => {
    button.addEventListener("click", () => activateTab(button.dataset.tab));
});

const initialTab = window.location.hash.replace("#", "");
activateTab(tabFrames[initialTab] ? initialTab : "normal");
</script>
</body>
</html>
