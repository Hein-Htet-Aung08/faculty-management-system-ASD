<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>RAG Mode</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body { margin: 0; background: transparent; }
        .actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: end; margin-bottom: 1rem; }
        .actions .form-field { flex: 1 1 16rem; }
    </style>
</head>
<body>

<section class="panel-section">
    <h2>RAG Mode</h2>

    <div class="actions">
        <button type="button" class="btn" data-action="refresh">Refresh Corpus</button>
    </div>
    <div id="refresh-panel" class="ai-result-panel"></div>
</section>

<section class="panel-section">
    <h2>retrieve</h2>
    <div class="actions">
        <div class="form-field">
            <label for="retrieve-query">Query</label>
            <input id="retrieve-query" value="staff overloaded in Computer Science">
        </div>
        <button type="button" class="btn" data-action="retrieve">Retrieve Context</button>
    </div>
    <div id="retrieve-panel" class="ai-result-panel"></div>
</section>

<section class="panel-section">
    <h2>ask</h2>
    <div class="actions">
        <div class="form-field">
            <label for="ask-query">Question</label>
            <input id="ask-query" value="Which staff members are overloaded?">
        </div>
        <button type="button" class="btn" data-action="ask">Answer with Citations</button>
    </div>
    <div id="ask-panel" class="ai-result-panel"></div>
</section>

<script src="/js/config.js"></script>
<script>
// Renders RAG responses with the same ledger-table/stamp look the rest of
// the dashboard uses, instead of a raw JSON dump.

function esc(value) {
    const div = document.createElement("div");
    div.textContent = value === null || value === undefined ? "" : String(value);
    return div.innerHTML;
}

function stamp(label) {
    const css = {
        high: "status-active",
        medium: "status-applied",
        low: "status-rejected",
    }[String(label || "").toLowerCase()] || "status-proposed";
    return `<span class="stamp ${css}">${esc(label || "Unknown")}</span>`;
}

function table(headers, rows) {
    if (!rows.length) return '<p class="empty-state">No records.</p>';
    const head = headers.map((h) => `<th>${esc(h)}</th>`).join("");
    const body = rows
        .map((row) => `<tr>${row.map((cell) => `<td>${esc(cell)}</td>`).join("")}</tr>`)
        .join("");
    return `<table class="ledger-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function errorBlock(data) {
    return `<p class="error-state">${esc(data.error)}${data.details ? " - " + esc(data.details) : ""}</p>`;
}

function renderRefresh(data) {
    if (data.error || data.status === "error") return errorBlock(data);
    return table(
        ["Field", "Value"],
        Object.entries(data).map(([key, value]) => [key, value])
    );
}

function renderRetrieve(data) {
    if (data.error || data.status === "error") return errorBlock(data);
    const results = data.results || [];
    const summary = `<p class="project-id">Mode: ${esc(data.retrieval_mode)} &middot; ${results.length} result(s)</p>`;
    const rows = results.map((r) => [
        r.rank,
        r.source_id,
        r.authority_tier,
        r.feature,
        r.student,
        (r.text || "").length > 160 ? r.text.slice(0, 160) + "..." : r.text,
    ]);
    return summary + table(["Rank", "Source", "Tier", "Feature", "Student", "Text"], rows);
}

function renderAsk(data) {
    if (data.error && !data.citations) return errorBlock(data);

    const header = `<p>${esc(data.answer)}</p><p class="project-id">Confidence: ${stamp(data.confidence_category)}</p>`;
    const citations = data.citations || [];
    const body = citations.length
        ? table(
              ["Chunk", "Source", "Tier", "Feature", "Student"],
              citations.map((c) => [c.chunk_id, c.source_id, c.authority_tier, c.feature, c.student])
          )
        : '<p class="empty-state">No citations - insufficient context.</p>';

    return header + (data.error ? errorBlock(data) : "") + body;
}

const RENDERERS = { "/rag/refresh": renderRefresh, "/rag/retrieve": renderRetrieve, "/rag/ask": renderAsk };

async function callRag(panelId, path, body) {
    const panel = document.getElementById(panelId);
    panel.innerHTML = '<p class="empty-state">Calling RAG server... this can take up to a minute.</p>';

    try {
        const response = await fetch(`${BACKEND_URL}${path}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
        });
        const data = await response.json();
        panel.innerHTML = RENDERERS[path](data);
    } catch (error) {
        panel.innerHTML =
            `<p class="error-state">Request failed. Is the backend running at ` +
            `${BACKEND_URL}, and is the shared rag-server running on port 5200?</p><pre>${esc(error)}</pre>`;
    }
}

document.querySelector('[data-action="refresh"]').addEventListener("click", () => {
    callRag("refresh-panel", "/rag/refresh", {});
});

document.querySelector('[data-action="retrieve"]').addEventListener("click", () => {
    callRag("retrieve-panel", "/rag/retrieve", { query: document.getElementById("retrieve-query").value, k: 5 });
});

document.querySelector('[data-action="ask"]').addEventListener("click", () => {
    callRag("ask-panel", "/rag/ask", { query: document.getElementById("ask-query").value, k: 5 });
});
</script>
</body>
</html>
