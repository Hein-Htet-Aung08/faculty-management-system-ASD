services:
  student4-frontend:
    build:
      context: ./frontend
    container_name: student4-frontend
    ports:
      - "8004:8004"
    environment:
      STUDENT4_BACKEND_URL: http://student4-backend:5004
      STAFF_SERVICE_URL: http://staff-backend:5001
    volumes:
      - ../shared/frontend/css:/shared/frontend/css:ro
    depends_on:
      - student4-backend
    networks:
      - faculty-network
    restart: unless-stopped

  student4-backend:
    build:
      context: ./backend
    container_name: student4-backend
    ports:
      - "5004:5004"
    environment:
      DATABASE_SERVICE_URL: http://student4-database:5104
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
      PORT: 5004
      STAFF_SERVICE_URL: http://staff-backend:5001
      WORKLOAD_SERVICE_URL: http://student3-backend:5003
      MCP_ENABLED: "true"
      MCP_SERVER_URL: http://host.docker.internal:5201/mcp
      RAG_ENABLED: "true"
      RAG_SERVER_URL: http://host.docker.internal:5200
      MULTI_AGENT_ENABLED: "true"
      MULTI_AGENT_SERVER_URL: http://host.docker.internal:5202
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - student4-database
    networks:
      - faculty-network
    restart: unless-stopped

  student4-database:
    build:
      context: ./database-service
    container_name: student4-database
    ports:
      - "5104:5104"
    environment:
      DATA_DIR: /app/data
      PORT: 5104
    volumes:
      - student4_data:/app/data
    networks:
      - faculty-network
    restart: unless-stopped

volumes:
  student4_data:

networks:
  faculty-network:
    driver: bridge