<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research &amp; Grant Ledger</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.10/htmx.min.js"></script>
</head>
<body>

  <header class="ledger-header feature-header">
    <div>
      <h1>Research &amp; Grant Ledger</h1>
      <p class="subtitle">Faculty Management System — Research and Grant Management</p>
    </div>
    <div class="feature-actions">
      <a class="btn secondary home-link" href="http://localhost:8000">&larr; All features</a>
    </div>

    <nav class="tab-nav">
      <button
        class="tab-button active"
        hx-get="/tabs/normal"
        hx-target="#tab-content"
        hx-swap="innerHTML"
        onclick="setActiveTab(this)"
      >
        Projects &amp; Grants
      </button>
      <button
        class="tab-button"
        hx-get="/tabs/ai-mode"
        hx-target="#tab-content"
        hx-swap="innerHTML"
        onclick="setActiveTab(this)"
      >
        AI Insights
      </button>
      <button
        class="tab-button"
        hx-get="/tabs/mcp"
        hx-target="#tab-content"
        hx-swap="innerHTML"
        onclick="setActiveTab(this)"
      >
        MCP Tools
      </button>
      <button
        class="tab-button"
        hx-get="/tabs/rag"
        hx-target="#tab-content"
        hx-swap="innerHTML"
        onclick="setActiveTab(this)"
      >
        RAG
      </button>
      <button
        class="tab-button"
        hx-get="/tabs/multi-agent"
        hx-target="#tab-content"
        hx-swap="innerHTML"
        onclick="setActiveTab(this)"
      >
        Multi-Agent
      </button>
    </nav>
  </header>

  <main class="ledger-panel" id="tab-content" hx-get="/tabs/normal" hx-trigger="load">
    <!-- Tab content loads here -->
  </main>

  <script>
    function setActiveTab(clicked) {
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      clicked.classList.add('active');
    }

    // const API_BASE = 'http://localhost:5004';
    const API_BASE = {{ research_api_base | tojson }};

    // const STAFF_API_BASE = 'http://localhost:5001';
    const STAFF_API_BASE = {{ staff_api_base | tojson }};
  </script>

</body>
</html>
